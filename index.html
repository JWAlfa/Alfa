            font-style: italic;
        }
        
        .card-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card-display {
            width: 200px;
            height: 320px;
            background: linear-gradient(135deg, #3d1a5f 0%, #2d0052 100%);
            border: 3px solid #9d4edd;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(157, 78, 221, 0.5),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            padding: 10px;
        }
        
        .card-display::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.1), transparent 50%);
            pointer-events: none;
        }
        
        .card-image-container {
            width: 100%;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            line-height: 1;
            z-index: 1;
            position: relative;
            background: radial-gradient(circle at 50% 50%, rgba(193, 156, 221, 0.15), transparent 70%);
            border-radius: 10px;
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 8px rgba(157, 78, 221, 0.3));
        }
        
        .card-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            z-index: 1;
            position: relative;
        }
        
        .card-display:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(157, 78, 221, 0.6),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        
        .card-display.flipping {
            animation: flip 0.6s ease-in-out;
        }
        
        @keyframes flip {
            0% { transform: rotateY(0deg); }
            50% { transform: rotateY(90deg); }
            100% { transform: rotateY(0deg); }
        }
        
        .card-name {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffd60a;
            text-align: center;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
            z-index: 1;
        }
        
        .card-suit {
            font-size: 0.9rem;
            color: #b19cd9;
            text-align: center;
            margin-top: 5px;
            z-index: 1;
        }

            background: linear-gradient(135deg, #9d4edd 0%, #7209b7 100%);
            color: #fff;
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 5px 20px rgba(157, 78, 221, 0.4);

            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(157, 78, 221, 0.6);
        }

            transform: scale(0.98);
        }

            background: rgba(157, 78, 221, 0.1);
            border-left: 4px solid #9d4edd;
            padding: 20px;
            border-radius: 8px;

                meaning: "Apprenticeship, skill, and mastery. Learning and dedication.",
                symbolism: "Eight pentacles represent craftsmanship; the craftsman represents dedication; the city represents achievement.",
                arcana: "Minor"
            },
            {
                name: "Nine of Pentacles",
                suit: "Pentacles",
                icon: "🍇",
                meaning: "Abundance, independence, and security. Material comfort.",
                symbolism: "Nine pentacles represent abundance; the woman represents independence; the vineyard represents success.",
                arcana: "Minor"
            },
            {
                name: "Ten of Pentacles",
                suit: "Pentacles",
                icon: "🏰",
                meaning: "Wealth, family, and legacy. Inheritance and completion.",
                symbolism: "Ten pentacles represent completeness; the family represents legacy; the estate represents security.",
                arcana: "Minor"
            }
        ];

        function updateDate() {
            const today = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateString = today.toLocaleDateString('en-US', options);
            document.getElementById('dateDisplay').textContent = `Today: ${dateString}`;
        }

        function getDateRelevance(date) {
            const day = date.getDate();
            const month = date.getMonth() + 1;
            const dayOfWeek = date.getDay();
            
            const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            
            const dayOfWeekName = dayNames[dayOfWeek];
            const monthName = monthNames[month - 1];
            
            const numerologySum = (day + month).toString().split('').map(Number).reduce((a, b) => a + b, 0);
            
            let relevance = `This card appears on ${dayOfWeekName}, in the month of ${monthName}. `;
            relevance += `Numerologically, today (${day}/${month}) reduces to the number ${numerologySum}, `;
            
            switch(numerologySum) {
                case 1:
                    relevance += "representing new beginnings and leadership.";
                    break;
                case 2:
                    relevance += "representing balance and duality.";
                    break;
                case 3:
                    relevance += "representing creativity and expression.";
                    break;
                case 4:
                    relevance += "representing stability and foundation.";
                    break;
                case 5:
                    relevance += "representing change and adventure.";
                    break;
                case 6:
                    relevance += "representing harmony and responsibility.";
                    break;
                case 7:
                    relevance += "representing spirituality and reflection.";
                    break;
                case 8:
                    relevance += "representing abundance and success.";
                    break;
                case 9:
                    relevance += "representing completion and humanitarianism.";
                    break;
            }
            
            return relevance;
        }

        function drawCard() {
            const cardDisplay = document.getElementById('cardDisplay');
            const cardDetails = document.getElementById('cardDetails');
            
            cardDisplay.classList.add('flipping');
            
            setTimeout(() => {
                const randomIndex = Math.floor(Math.random() * tarotDeck.length);
                const card = tarotDeck[randomIndex];
                
                document.querySelector('.card-image-container').textContent = card.icon;
                document.querySelector('.card-name').textContent = card.name;
                document.querySelector('.card-suit').textContent = card.suit;
                
                document.getElementById('cardMeaning').textContent = card.meaning;
                document.getElementById('cardSymbolism').textContent = card.symbolism;
                document.getElementById('cardRelevance').textContent = getDateRelevance(new Date());
                
                cardDetails.style.display = 'block';
                cardDisplay.classList.remove('flipping');
            }, 300);
        }

        // Initialize on page load
        window.addEventListener('load', () => {
            updateDate();
        });
    </script>
</body>
</html>
